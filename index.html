<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おすすめマップ</title>
  </head>
  <body>
    <div id="map"></div>

    <button id="menu-toggle" class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false">
      <span class="menu-toggle__icon">☰</span>
    </button>

    <!-- B: カテゴリの表示/非表示は、メニューとは独立して常に右上に表示する -->
    <div id="category-panel" class="category-panel"></div>

    <aside id="side-menu" class="side-menu">
      <div class="side-menu__header">
        <h1>おすすめマップ</h1>
      </div>

      <!-- SNSリンク -->
      <div class="social-links">
        <a
          href="https://www.youtube.com/@eigo_travel"
          target="_blank"
          rel="noopener noreferrer"
          class="social-links__item social-links__item--youtube"
          aria-label="YouTube"
        >
          <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true">
            <rect width="48" height="48" rx="10" fill="#FF0000" />
            <path d="M20 16.5L32 24L20 31.5V16.5Z" fill="#fff" />
          </svg>
        </a>
        <a
          href="https://www.instagram.com/_eigo55/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-links__item social-links__item--instagram"
          aria-label="Instagram"
        >
          <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true">
            <defs>
              <radialGradient id="ig-gradient" cx="0.3" cy="1" r="1.2">
                <stop offset="0%" stop-color="#FFDD55" />
                <stop offset="25%" stop-color="#FF543E" />
                <stop offset="50%" stop-color="#C837AB" />
                <stop offset="100%" stop-color="#5851DB" />
              </radialGradient>
            </defs>
            <rect width="48" height="48" rx="10" fill="url(#ig-gradient)" />
            <rect x="13" y="13" width="22" height="22" rx="6" fill="none" stroke="#fff" stroke-width="2.2" />
            <circle cx="24" cy="24" r="6" fill="none" stroke="#fff" stroke-width="2.2" />
            <circle cx="31.5" cy="16.5" r="1.6" fill="#fff" />
          </svg>
        </a>
      </div>

      <!-- A-1: 簡単なメッセージBOX -->
      <div class="message-box">
        自分が実際に行っておすすめできる場所だけを集めた地図です。<br />
        気になる地域を選んで探してみてください。
      </div>

      <!-- A-2: 地域から探す -->
      <div class="menu-section">
        <div class="menu-section__title">地域から探す</div>
        <div id="region-nav" class="region-nav"></div>
      </div>

      <!-- A-3: 最近の更新 -->
      <div class="menu-section">
        <div class="menu-section__title">最近の更新</div>
        <ul id="recent-updates" class="recent-updates"></ul>
      </div>

      <div class="menu-section menu-section--contact">
        <a href="/contact/" class="contact-button">✉️ お問い合わせ</a>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
