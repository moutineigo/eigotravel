<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>おすすめマップ - 管理画面</title>
  </head>
  <body>
    <div class="admin-layout">
      <header class="admin-header">
        <h1>管理画面</h1>
      </header>
      <div class="admin-body">
        <div class="admin-map-wrap">
          <div id="admin-map" class="admin-map"></div>
          <div class="locate-box">
            <input
              type="text"
              id="f-locate"
              placeholder="🔍 緯度経度 / Googleマップのリンク / 場所名"
              autocomplete="off"
            />
            <button type="button" id="f-locate-btn">移動</button>
          </div>
        </div>
        <div class="admin-sidebar">
          <form id="spot-form">
            <input type="hidden" id="f-lat" />
            <input type="hidden" id="f-lng" />
            <p id="f-edit-banner" class="edit-banner" hidden>
              ✏️ 編集中: <span id="f-edit-name"></span>
              <button type="button" id="f-edit-cancel">キャンセル</button>
            </p>
            <p id="f-latlng" class="latlng-display">📍 地図をタップして位置を選択してください</p>

            <label>名前 <span class="req">*</span><input type="text" id="f-name" required /></label>

            <label
              >カテゴリ <span class="req">*</span>
              <select id="f-category" required></select>
            </label>

            <label
              >地域（都道府県 or 国）
              <select id="f-region">
                <option value="">未設定</option>
              </select>
            </label>

            <label>説明<textarea id="f-description" rows="4"></textarea></label>
            <label>住所<input type="text" id="f-address" /></label>
            <label>URL<input type="url" id="f-url" placeholder="https://..." /></label>
            <label>タグ（カンマ区切り）<input type="text" id="f-tags" placeholder="例: 絶景, 穴場" /></label>

            <div id="existing-photos-section" hidden>
              <label>登録済みの写真（✕で削除予約、保存で確定）</label>
              <div id="existing-photos" class="photo-preview"></div>
            </div>

            <label>
              写真を追加（複数選択できます）
              <input type="file" id="f-photos" accept="image/*" multiple />
            </label>
            <div id="photo-preview" class="photo-preview"></div>

            <div id="existing-videos-section" hidden>
              <label>登録済みの動画（✕で削除予約、保存で確定）</label>
              <div id="existing-videos" class="video-preview"></div>
            </div>

            <label>
              動画を追加（複数選択できます）
              <input type="file" id="f-videos" accept="video/*" multiple />
            </label>
            <div id="video-preview" class="video-preview"></div>

            <button type="submit" id="f-submit-btn">この内容で登録する</button>
            <p id="form-message" class="form-message"></p>
          </form>

          <hr />

          <h2>登録済みスポット</h2>
          <label class="spot-list-filter">
            地域で絞り込み
            <select id="f-filter-region">
              <option value="">すべて</option>
            </select>
          </label>
          <p class="spot-list-count">
            全<span id="spot-count">0</span>件（更新日が新しい順）
          </p>
          <ul id="spot-list" class="spot-list"></ul>
          <div id="spot-pagination" class="spot-pagination"></div>
        </div>
      </div>
    </div>
    <script type="module" src="../src/admin/main.ts"></script>
  </body>
</html>
